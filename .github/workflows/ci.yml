name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.3

jobs:
  check:
    name: Lint, build, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # For the @dql-kit/drizzle-mysql tests.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dqlkit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # bun.lock is gitignored, so there is nothing to freeze against.
      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      # Build first: the per-package tsc builds emit the .d.ts that dependent
      # packages type-check against, and story-verse loads core/drizzle dist.
      - name: Build
        run: bun run build

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun run test
        env:
          MYSQL_URL: mysql://root:root@127.0.0.1:3306/dqlkit
