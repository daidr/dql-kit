name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2

jobs:
  check:
    name: Lint, build, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # bun.lock is gitignored, so there is nothing to freeze against.
      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      # Build first: the per-package tsc builds emit the .d.ts that dependent
      # packages type-check against, and story-verse loads core/drizzle dist.
      - name: Build
        run: bun run build

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun run test
